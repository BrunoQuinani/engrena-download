<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMAP - Nova senha</title>
  <style>
    :root { --marinho:#0c3b5e; --destaque:#0f548c; --fundo:#f2f5f8; --texto:#14212b; --card:#fff; --borda:#c9d3d8; }
    @media (prefers-color-scheme: dark) { :root { --fundo:#121a22; --texto:#e8eef3; --card:#18232d; --borda:#2a3946; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Segoe UI", system-ui, sans-serif; background:var(--fundo); color:var(--texto); padding:16px; }
    .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--borda); border-radius:10px; padding:26px; }
    h1 { margin:0 0 4px; color:var(--destaque); }
    label { display:block; margin:14px 0 4px; font-size:.9rem; }
    input { width:100%; padding:10px; border:1px solid var(--borda); border-radius:6px; font-size:1rem; background:transparent; color:inherit; }
    button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:6px; background:var(--destaque); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    #msg { margin-top:14px; min-height:1.2em; font-size:.95rem; }
    .ok { color:#2e7d32; } .erro { color:#c62828; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SIMAP</h1>
    <p>Defina sua nova senha.</p>
    <form id="form" hidden>
      <label for="s1">Nova senha (mínimo 6 caracteres)</label>
      <input id="s1" type="password" autocomplete="new-password" required minlength="6">
      <label for="s2">Confirmar nova senha</label>
      <input id="s2" type="password" autocomplete="new-password" required minlength="6">
      <button id="salvar" type="submit">Salvar nova senha</button>
    </form>
    <div id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // A chave "publishable" é pública por desenho; os dados são protegidos pelo RLS do banco.
    const sb = supabase.createClient(
      "https://fdhkcbsazgidnmkxspwg.supabase.co",
      "sb_publishable_maNCoIioNUi-8_Aogfqzew_Tm_PeF7P"
    );
    const msg = (t, cls) => { const m = document.getElementById("msg"); m.textContent = t; m.className = cls || ""; };
    const form = document.getElementById("form");

    // O link do e-mail traz a sessão de recuperação na URL; o supabase-js a lê sozinho.
    sb.auth.onAuthStateChange((evento) => {
      if (evento === "PASSWORD_RECOVERY" || evento === "SIGNED_IN") form.hidden = false;
    });
    setTimeout(async () => {
      const { data } = await sb.auth.getSession();
      if (data.session) form.hidden = false;
      else if (form.hidden) msg("Link inválido ou expirado. Peça um novo em “Esqueci minha senha” no aplicativo.", "erro");
    }, 1500);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const s1 = document.getElementById("s1").value, s2 = document.getElementById("s2").value;
      if (s1 !== s2) return msg("As senhas não conferem.", "erro");
      document.getElementById("salvar").disabled = true;
      const { error } = await sb.auth.updateUser({ password: s1 });
      if (error) { document.getElementById("salvar").disabled = false; return msg("Não foi possível salvar: " + error.message, "erro"); }
      form.hidden = true;
      await sb.auth.signOut();
      msg("Senha alterada! Já pode voltar ao aplicativo e entrar com a nova senha.", "ok");
    });
  </script>
</body>
</html>
